<button
  type="button"
  class="menu-button"
  [attr.aria-label]="'shell.menu' | translate"
  [attr.aria-expanded]="navExpanded()"
  aria-controls="qms-sidebar"
  (click)="menuToggle.emit()"
>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  </svg>
</button>

<div class="actions">
  <qms-language-switch />
  @if (user(); as current) {
    <div class="user">
      <span class="user__avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="user__text">
        <span class="user__name">{{ current.name }}</span>
        <span class="user__role">{{ 'roles.' + current.role | translate }}</span>
      </span>
    </div>
  }
  <button mat-stroked-button type="button" class="sign-out" [disabled]="signingOut()" (click)="signOut()">
    {{ 'shell.signOut' | translate }}
  </button>
</div>
