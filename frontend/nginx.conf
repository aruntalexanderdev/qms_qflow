# Web container (STORY-004, ADR-006): serves the Angular build and proxies the API on the same origin, so the
# HttpOnly refresh cookie (Path=/api/v1/auth) works without CORS. No path or cookie rewriting on purpose.
# Runs unprivileged on 8080 (nginxinc/nginx-unprivileged).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/woff image/x-icon;

    # API: same path, same cookie. The API does not read the forwarded headers yet (hosting story).
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # SignalR: WebSocket upgrade, long-lived connections.
    location ^~ /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Swagger and OpenAPI are served by the API port only.
    location ~ ^/(swagger|openapi) {
        return 404;
    }

    # Translation files keep their name between builds: always revalidate.
    location ^~ /i18n/ {
        try_files $uri =404;
        include /etc/nginx/qms-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build files can be cached for a year.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        include /etc/nginx/qms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback; index.html is never cached so a new build is picked up.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/qms-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
