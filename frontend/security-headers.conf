# Included by nginx.conf in every location that serves the app. add_header in a location replaces the server-level
# ones, so the headers live here once.
# Self-only CSP (spec 11: no CDN). 'unsafe-inline' for styles is needed by Angular component styles and Angular
# Material; scripts are 'self' only (the build does not inline scripts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
