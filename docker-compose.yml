# Local stack: postgres, api, web. Open the app at http://localhost:${WEB_PORT:-4200} (Chrome, Edge or Firefox; the
# Secure refresh cookie needs localhost, not a LAN address). Values come from .env (copy .env.example).
name: qms

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data in a version-specific subfolder of /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Qms.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Qms: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Auth (STORY-003). The signing key is required; the seed users are read only in Development (empty = skipped).
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (openssl rand -base64 48)}
      Seed__SuperAdmin__UserName: ${SEED_SUPERADMIN_USERNAME:-}
      Seed__SuperAdmin__Password: ${SEED_SUPERADMIN_PASSWORD:-}
      Seed__CompanyAdmin__UserName: ${SEED_COMPANYADMIN_USERNAME:-}
      Seed__CompanyAdmin__Password: ${SEED_COMPANYADMIN_PASSWORD:-}
    ports:
      # Loopback only; Swagger (Development) must not be reachable from the LAN. See backend/README.md.
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Loopback only, like the API. The browser reaches the API through this container (same origin, ADR-006).
      - "127.0.0.1:${WEB_PORT:-4200}:8080"

volumes:
  pgdata:
